<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Digital DELIMa 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Container dinamik mengikut mod peranti */
        .kamera-wrapper {
            position: relative;
            width: 100%;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background-color: #000;
            border: 8px solid #ffffff;
            transition: all 0.3s ease;
        }

        /* Mod Landscape (Laptop/Desktop) - Nisbah 16:9 */
        .mode-landscape {
            aspect-ratio: 16 / 9;
            max-width: 1024px;
        }

        /* Mod Portrait (Handphone) - Nisbah 9:16 */
        .mode-portrait {
            aspect-ratio: 9 / 16;
            max-width: 450px;
        }

        #kamera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #bingkai-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 md:py-8 font-sans">

    <div class="text-center mb-4 md:mb-6 px-2 md:px-4">
        <h1 class="text-3xl md:text-5xl font-extrabold text-blue-800 mb-2 drop-shadow-md">
            Photobooth Digital
        </h1>
        <p class="text-lg md:text-2xl text-blue-600 font-semibold">
            Karnival Pendidikan MADANI Daerah Pekan Tahun 2026
        </p>
    </div>

    <div id="ruang-kamera" class="w-full px-2 md:px-4 mb-6 text-center">
        <!-- Container kamera & Bingkai dengan kelas dinamik -->
        <div id="wrapper-kamera" class="kamera-wrapper mode-landscape">
            <video id="kamera" autoplay playsinline></video>
            
            <!-- Bingkai Overlay (Tukar src mengikut peranti secara dinamik) -->
            <img id="bingkai-overlay" src="bingkai_landscape.png" alt="Bingkai Photobooth">
            
            <div id="amaran-kamera" class="absolute inset-0 flex items-center justify-center bg-gray-900 bg-opacity-80 text-white p-6 hidden z-20">
                <p class="text-xl font-bold text-center">Sila benarkan (Allow) akses kamera di pelayar web anda.</p>
            </div>
        </div>
        
        <button id="butang-snap" class="mt-8 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-4 px-12 rounded-full text-2xl shadow-[0_10px_20px_rgba(37,99,235,0.4)] transition-all duration-300 transform hover:scale-105 hover:-translate-y-1 active:scale-95 border-4 border-blue-300">
            📸 SNAP GAMBAR!
        </button>
    </div>

    <div id="ruang-hasil" class="w-full px-4 text-center hidden">
        <h2 class="text-3xl font-bold text-green-600 mb-6 drop-shadow-sm">Gambar Berjaya Disimpan! 🎉</h2>
        
        <p id="status-drive" class="text-blue-600 font-semibold mb-4 animate-pulse">Menghantar salinan ke Google Drive pempamer...</p>
        
        <div id="wrapper-hasil" class="kamera-wrapper mode-landscape mb-8">
            <img id="gambar-hasil" class="w-full h-full object-cover" src="" alt="Hasil Photobooth">
        </div>
        <div class="flex flex-wrap justify-center gap-4 md:gap-6">
            <button id="butang-semula" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 md:py-4 px-8 md:px-10 rounded-full shadow-lg transition transform hover:scale-105 text-lg md:text-xl">
                🔄 Ambil Gambar Baru
            </button>
            <a id="butang-muatturun" href="#" download="Photobooth_DELIMa.png" class="hidden"></a>
        </div>
        <p class="mt-4 text-gray-600 font-medium text-sm md:text-base">*Gambar sepatutnya dimuat turun secara automatik.</p>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwofSddTs266XNdVmHE89S8Hj_5DkrI6bnWvgamfhJVxkqE_9zCVhGbeBdf9IJJK3us/exec";

        const video = document.getElementById('kamera');
        const bingkaiOverlay = document.getElementById('bingkai-overlay');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gambarHasil = document.getElementById('gambar-hasil');
        const butangSnap = document.getElementById('butang-snap');
        const butangSemula = document.getElementById('butang-semula');
        const butangMuatTurun = document.getElementById('butang-muatturun');
        const ruangKamera = document.getElementById('ruang-kamera');
        const ruangHasil = document.getElementById('ruang-hasil');
        const amaranKamera = document.getElementById('amaran-kamera');
        const statusDrive = document.getElementById('status-drive');
        const wrapperKamera = document.getElementById('wrapper-kamera');
        const wrapperHasil = document.getElementById('wrapper-hasil');

        // --- AUTO-DETECT PERANTI & TETAPAN RESOLUSI LUAS (TIDAK ZOOM) ---
        const adakahTelefon = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

        let resolusiKamera;
        let failBingkaiPilihan = "";

        if (adakahTelefon) {
            // Lebarkan sudut pandangan kamera telefon dan kurangkan paksaan zoom dekat
            resolusiKamera = { 
                width: { ideal: 720 }, 
                height: { ideal: 1280 } 
            };
            failBingkaiPilihan = "bingkai_portrait.png"; 
            
            wrapperKamera.className = "kamera-wrapper mode-portrait";
            wrapperHasil.className = "kamera-wrapper mode-portrait";
        } else {
            resolusiKamera = { 
                width: { ideal: 1280 }, 
                height: { ideal: 720 } 
            };
            failBingkaiPilihan = "bingkai_landscape.png"; 
            
            wrapperKamera.className = "kamera-wrapper mode-landscape";
            wrapperHasil.className = "kamera-wrapper mode-landscape";
        }

        bingkaiOverlay.src = failBingkaiPilihan;

        // 1. Minta kebenaran dan buka Kamera mengikut tetapan luas
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                width: resolusiKamera.width, 
                height: resolusiKamera.height, 
                facingMode: "user" 
            } 
        })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Ralat membuka kamera:", err);
            amaranKamera.classList.remove('hidden');
        });

        // 2. Fungsi apabila butang SNAP ditekan
        butangSnap.addEventListener('click', () => {
            const snapSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-camera-shutter-click-1133.mp3');
            snapSound.play().catch(e => console.log("Audio cannot play automatically"));

            // Tetapkan saiz canvas berdasarkan saiz sebenar video kamera yang diterima
            canvas.width = video.videoWidth || (adakahTelefon ? 720 : 1280);
            canvas.height = video.videoHeight || (adakahTelefon ? 1280 : 720);

            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();

            if (bingkaiOverlay.complete && bingkaiOverlay.naturalHeight !== 0) {
                 ctx.drawImage(bingkaiOverlay, 0, 0, canvas.width, canvas.height);
            }

            const dataImej = canvas.toDataURL('image/png');
            gambarHasil.src = dataImej;
            butangMuatTurun.href = dataImej;

            const timestamp = new Date().getTime();
            const namaFailImej = `Photobooth_DELIMa_${timestamp}.png`;
            butangMuatTurun.download = namaFailImej;
            butangMuatTurun.click();

            statusDrive.innerText = "Menghantar salinan ke Google Drive pempamer...";
            statusDrive.classList.add("animate-pulse", "text-blue-600");
            statusDrive.classList.remove("text-green-600", "text-red-600");

            if(URL_GOOGLE_SCRIPT !== "LETAK_WEB_APP_URL_CIKGU_DI_SINI") {
                fetch(URL_GOOGLE_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify({ image: dataImej, filename: namaFailImej }),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                })
                .then(response => response.json())
                .then(data => {
                    statusDirectory.innerText = "✅ Salinan berjaya disimpan di Drive pempamer!";
                    statusDrive.innerText = "✅ Salinan berjaya disimpan di Drive pempamer!";
                    statusDrive.classList.replace("text-blue-600", "text-green-600");
                    statusDrive.classList.remove("animate-pulse");
                })
                .catch(error => {
                    statusDrive.innerText = "❌ Ralat menghantar ke Drive, tetapi gambar anda telah dimuat turun.";
                    statusDrive.classList.replace("text-blue-600", "text-red-600");
                    statusDrive.classList.remove("animate-pulse");
                });
            } else {
                statusDrive.innerText = "Sistem Drive belum dikonfigurasi.";
                statusDrive.classList.remove("animate-pulse");
            }

            ruangKamera.classList.add('hidden');
            ruangHasil.classList.remove('hidden');
        });

        // 3. Fungsi butang "Ambil Gambar Baru"
        butangSemula.addEventListener('click', () => {
            ruangKamera.classList.remove('hidden');
            ruangHasil.classList.add('hidden');
        });
    </script>
</body>
</html>
