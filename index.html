<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Digital - Karnival Pendidikan MADANI Daerah Pekan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .kamera-wrapper {
            position: relative;
            width: 100%;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background-color: #000;
            border: 8px solid #ffffff;
            transition: all 0.3s ease;
        }

        /* Mod Landscape (Laptop/Desktop) - Nisbah 16:9 */
        .mode-landscape {
            aspect-ratio: 16 / 9;
            max-width: 1024px;
        }

        /* Mod Portrait (Handphone) - Nisbah 9:16 */
        .mode-portrait {
            aspect-ratio: 9 / 16;
            max-width: 420px;
        }

        #kamera {
            width: 100%;
            height: 100%;
            /* Menggunakan contain supaya muka tidak terzoom rapat melampau */
            object-fit: contain;
            transform: scaleX(-1);
            background-color: #000;
        }

        #bingkai-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 md:py-8 font-sans">

    <div class="text-center mb-4 md:mb-6 px-2 md:px-4">
        <h1 class="text-2xl md:text-4xl font-extrabold text-blue-800 mb-1 drop-shadow-md">
            Photobooth Digital
        </h1>
        <p class="text-base md:text-xl text-blue-600 font-semibold">
            Karnival Pendidikan MADANI Daerah Pekan 2026
        </p>
    </div>

    <div id="ruang-kamera" class="w-full px-2 md:px-4 mb-6 text-center">
        <!-- Container kamera & Bingkai dengan kelas dinamik auto-detect -->
        <div id="wrapper-kamera" class="kamera-wrapper mode-landscape">
            <video id="kamera" autoplay playsinline muted></video>
            
            <!-- Bingkai Overlay -->
            <img id="bingkai-overlay" src="" alt="Bingkai Photobooth">
            
            <!-- Paparan Amaran & Butang Mula Kamera (Permission Handling) -->
            <div id="amaran-kamera" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 bg-opacity-95 text-white p-6 z-20">
                <div class="bg-blue-950 border border-blue-500 rounded-xl p-6 max-w-md mx-auto text-center shadow-2xl">
                    <span class="text-5xl mb-3 block">📸</span>
                    <h3 class="text-xl font-bold text-blue-300 mb-2" id="tajuk-amaran">Sedia Untuk Mula?</h3>
                    <p id="teks-ralat-kamera" class="text-sm md:text-base text-gray-200 mb-6 leading-relaxed">
                        Sila klik butang di bawah untuk membenarkan akses kamera pada peranti anda.
                    </p>
                    <button id="butang-mula-kamera" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105 text-lg">
                        🔓 Benarkan & Buka Kamera
                    </button>
                </div>
            </div>
        </div>
        
        <button id="butang-snap" class="mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-3 px-10 rounded-full text-xl shadow-[0_10px_20px_rgba(37,99,235,0.4)] transition-all duration-300 transform hover:scale-105 hover:-translate-y-1 active:scale-95 border-4 border-blue-300">
            📸 SNAP GAMBAR!
        </button>
    </div>

    <div id="ruang-hasil" class="w-full px-4 text-center hidden">
        <h2 class="text-2xl md:text-3xl font-bold text-green-600 mb-4 drop-shadow-sm">Gambar Berjaya Disimpan! 🎉</h2>
        
        <p id="status-drive" class="text-blue-600 font-semibold mb-4 animate-pulse"></p>
        
        <div id="wrapper-hasil" class="kamera-wrapper mode-landscape mb-6">
            <img id="gambar-hasil" class="w-full h-full object-cover" src="" alt="Hasil Photobooth">
        </div>
        <div class="flex flex-wrap justify-center gap-4">
            <button id="butang-semula" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105 text-base md:text-lg">
                🔄 Ambil Gambar Baru
            </button>
            <a id="butang-muatturun" href="#" download="Photobooth_DELIMa.png" class="hidden"></a>
        </div>
        <p class="mt-3 text-gray-600 font-medium text-sm">*Gambar sepatutnya dimuat turun secara automatik.</p>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        // Pautan Google Apps Script rasmi yang diberikan
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyIcPBN7vsSdO6aSaeXXkVxRA2I65-fGL5yuaqnb8IsHwWQihWYGxk8rhdraDjBGwMX/exec";

        const video = document.getElementById('kamera');
        const bingkaiOverlay = document.getElementById('bingkai-overlay');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gambarHasil = document.getElementById('gambar-hasil');
        const butangSnap = document.getElementById('butang-snap');
        const butangSemula = document.getElementById('butang-semula');
        const butangMuatTurun = document.getElementById('butang-muatturun');
        const ruangKamera = document.getElementById('ruang-kamera');
        const ruangHasil = document.getElementById('ruang-hasil');
        const amaranKamera = document.getElementById('amaran-kamera');
        const tajukAmaran = document.getElementById('tajuk-amaran');
        const teksRalatKamera = document.getElementById('teks-ralat-kamera');
        const butangMulaKamera = document.getElementById('butang-mula-kamera');
        const statusDrive = document.getElementById('status-drive');
        const wrapperKamera = document.getElementById('wrapper-kamera');
        const wrapperHasil = document.getElementById('wrapper-hasil');

        // Auto-detect peranti: Telefon bimbit guna portrait, laptop guna landscape
        const adakahTelefon = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

        let failBingkaiPilihan = "";

        if (adakahTelefon) {
            failBingkaiPilihan = "bingkai_portrait.png"; 
            wrapperKamera.className = "kamera-wrapper mode-portrait";
            wrapperHasil.className = "kamera-wrapper mode-portrait";
        } else {
            failBingkaiPilihan = "bingkai_landscape.png"; 
            wrapperKamera.className = "kamera-wrapper mode-landscape";
            wrapperHasil.className = "kamera-wrapper mode-landscape";
        }

        bingkaiOverlay.src = failBingkaiPilihan;
        bingkaiOverlay.onerror = function() {
            this.src = adakahTelefon 
                ? 'https://placehold.co/720x1280/transparent/blue?text=Bingkai+Portrait+(720x1280)' 
                : 'https://placehold.co/1280x720/transparent/blue?text=Bingkai+Landscape+(1280x720)';
        };

        async function bukaKamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                tajukAmaran.innerText = "Tidak Disokong";
                teksRalatKamera.innerHTML = "Pelayar web anda tidak menyokong fungsi akses kamera. Sila gunakan pelayar moden seperti Chrome, Safari, atau Edge.";
                amaranKamera.classList.remove('hidden');
                return;
            }

            try {
                if (video.srcObject) {
                    const tracks = video.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                }

                // Tetapan resolusi optimum mengikut jenis peranti
                const constraints = {
                    video: {
                        facingMode: "user",
                        width: { ideal: adakahTelefon ? 720 : 1280 },
                        height: { ideal: adakahTelefon ? 1280 : 720 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                amaranKamera.classList.add('hidden');
            } catch (err) {
                console.error("Ralat membuka kamera:", err);
                tajukAmaran.innerText = "Akses Kamera Disekat / Gagal";
                let mesejRalat = "Gagal memuatkan kamera. Sila pastikan tiada aplikasi lain yang sedang menggunakan kamera anda.";
                
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.message.includes('Permission denied')) {
                    mesejRalat = "Akses kamera telah ditolak oleh pelayar web. Sila klik ikon kunci/kamera di bar alamat pelayar, tukar kebenaran kepada <b>Allow</b>, kemudian klik butang di bawah.";
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    mesejRalat = "Tiada peranti kamera dikesan pada peranti ini.";
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    mesejRalat = "Kamera sedang digunakan oleh aplikasi lain atau tab pelayar yang lain.";
                }
                
                teksRalatKamera.innerHTML = mesejRalat;
                butangMulaKamera.innerText = "🔄 Cuba Buka Semula Kamera";
                amaranKamera.classList.remove('hidden');
            }
        }

        butangMulaKamera.addEventListener('click', () => {
            bukaKamera();
        });

        butangSnap.addEventListener('click', () => {
            const snapSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-camera-shutter-click-1133.mp3');
            snapSound.play().catch(e => console.log("Audio cannot play automatically"));

            // Tetapkan saiz canvas mengikut resolusi fizikal sebenar peranti tanpa herotan
            if (adakahTelefon) {
                canvas.width = 720;
                canvas.height = 1280;
            } else {
                canvas.width = 1280;
                canvas.height = 720;
            }

            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();

            if (bingkaiOverlay.complete && bingkaiOverlay.naturalHeight !== 0) {
                 ctx.drawImage(bingkaiOverlay, 0, 0, canvas.width, canvas.height);
            }

            const dataImej = canvas.toDataURL('image/png');
            gambarHasil.src = dataImej;
            butangMuatTurun.href = dataImej;

            const timestamp = new Date().getTime();
            const namaFailImej = `Photobooth_KarnivalPekan_${timestamp}.png`;
            butangMuatTurun.download = namaFailImej;
            butangMuatTurun.click();

            statusDrive.innerText = "Menghantar salinan ke Google Drive pempamer...";
            statusDrive.className = "text-blue-600 font-semibold mb-4 animate-pulse";

            // Hantar data imej mengikut saiz peranti ke Google Apps Script
            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                body: JSON.stringify({ image: dataImej, filename: namaFailImej }),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(response => response.json())
            .then(data => {
                statusDrive.innerText = "";
                statusDrive.className = "text-green-600 font-semibold mb-4";
            })
            .catch(error => {
                statusDrive.innerText = "";
                statusDrive.className = "text-amber-600 font-semibold mb-4";
            });

            ruangKamera.classList.add('hidden');
            ruangHasil.classList.remove('hidden');
        });

        butangSemula.addEventListener('click', () => {
            ruangKamera.classList.remove('hidden');
            ruangHasil.classList.add('hidden');
            bukaKamera();
        });
    </script>
</body>
</html>
