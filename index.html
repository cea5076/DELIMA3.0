<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth DELIMa & Inovasi PdPc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Memastikan video dan bingkai bertindih dengan betul */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }
        #kamera {
            width: 100%;
            height: auto;
            display: block;
        }
        #bingkai-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Supaya klik tidak terhalang */
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10 font-sans">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-blue-700 mb-2">Photobooth Madani</h1>
        <p class="text-lg text-gray-600">Booth DELIMa 3.0 & Inovasi Game PdPc</p>
    </div>

    <!-- Bahagian Kamera Langsung -->
    <div id="ruang-kamera" class="w-full px-4 mb-6 text-center">
        <div class="camera-container">
            <!-- Paparan WebCam -->
            <video id="kamera" autoplay playsinline></video>
            <!-- Bingkai dari Canva (Pastikan nama fail ini betul di komputer anda) -->
            <img id="bingkai-overlay" src="bingkai.png" alt="Bingkai" onerror="this.style.display='none'">
        </div>
        
        <button id="butang-snap" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transition duration-300 transform hover:scale-105">
            📸 SNAP GAMBAR!
        </button>
    </div>

    <!-- Bahagian Paparan Hasil Gambar -->
    <div id="ruang-hasil" class="w-full px-4 text-center hidden">
        <h2 class="text-2xl font-bold text-green-600 mb-4">Gambar Berjaya Diambil! 🎉</h2>
        <div class="camera-container mb-6">
            <img id="gambar-hasil" class="w-full h-auto" src="" alt="Hasil Photobooth">
        </div>
        
        <div class="flex justify-center gap-4">
            <button id="butang-semula" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-full shadow transition">
                Ambil Semula
            </button>
            <a id="butang-muatturun" href="#" download="Photobooth_DELIMa.png" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-full shadow transition">
                ⬇️ Muat Turun
            </a>
        </div>
    </div>

    <!-- Canvas Tersembunyi untuk proses penggabungan gambar dan bingkai -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('kamera');
        const bingkaiOverlay = document.getElementById('bingkai-overlay');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gambarHasil = document.getElementById('gambar-hasil');
        const butangSnap = document.getElementById('butang-snap');
        const butangSemula = document.getElementById('butang-semula');
        const butangMuatTurun = document.getElementById('butang-muatturun');
        const ruangKamera = document.getElementById('ruang-kamera');
        const ruangHasil = document.getElementById('ruang-hasil');

        // 1. Minta kebenaran dan buka Kamera
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Ralat membuka kamera:", err);
                alert("Sila benarkan akses kamera untuk menggunakan photobooth ini.");
            });

        // 2. Fungsi apabila butang SNAP ditekan
        butangSnap.addEventListener('click', () => {
            // Tetapkan saiz canvas sama dengan saiz video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Lukis gambar dari video ke canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Lukis bingkai di atas gambar video
            // (Jika fail bingkai.png wujud dan berjaya dimuat)
            if (bingkaiOverlay.complete && bingkaiOverlay.naturalHeight !== 0) {
                 ctx.drawImage(bingkaiOverlay, 0, 0, canvas.width, canvas.height);
            }

            // Tukar canvas menjadi URL Imej
            const dataImej = canvas.toDataURL('image/png');
            
            // Paparkan di skrin
            gambarHasil.src = dataImej;
            butangMuatTurun.href = dataImej;

            // --- FUNGSI BARU: AUTO-DOWNLOAD & NAMA FAIL UNIK ---
            // Dapatkan masa sekarang (cth: 1716382910) supaya nama fail tak bertindih
            const timestamp = new Date().getTime();
            butangMuatTurun.download = `Photobooth_Madani_${timestamp}.png`;
            
            // Sistem tolong 'klik' butang muat turun secara automatik
            butangMuatTurun.click();
            // --------------------------------------------------

            // Sembunyikan kamera, tunjukkan hasil
            ruangKamera.classList.add('hidden');
            ruangHasil.classList.remove('hidden');
        });

        // 3. Fungsi untuk ambil gambar semula
        butangSemula.addEventListener('click', () => {
            ruangKamera.classList.remove('hidden');
            ruangHasil.classList.add('hidden');
        });
    </script>
</body>
</html>
